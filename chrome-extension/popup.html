<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subtitle Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="32" height="32">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#818cf8"/>
              <stop offset="1" stop-color="#4338ca"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#logoGrad)"/>
          <rect x="6.5" y="11" width="19" height="3.6" rx="1.8" fill="#fff"/>
          <rect x="6.5" y="17.4" width="12" height="3.6" rx="1.8" fill="#fff" opacity="0.7"/>
        </svg>
      </div>
      <div class="hero-text">
        <h1>Subtitle Translator</h1>
        <p class="tagline">On-demand caption translations</p>
      </div>
      <label class="enable" title="Enable translations">
        <span class="enable-label">Enable</span>
        <input type="checkbox" id="toggleEnabled" class="sr-only peer" checked>
        <div class="toggle relative w-11 h-6 bg-gray-600 rounded-full peer-checked:bg-indigo-500 transition-colors">
          <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
        </div>
      </label>
    </header>

    <p class="desc">
      Press <span class="hl">hotkey</span> on a video with captions to see a translation and a short meaning.
    </p>

    <div id="signedOut" class="auth-banner hidden">
      <button id="signIn" class="btn-google" type="button">
        <svg class="g-icon" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>
      <p id="authError" class="error hidden"></p>
    </div>

    <div id="signedIn" class="account hidden">
      <div class="account-row">
        <span id="userEmail" class="email"></span>
        <button id="signOut" class="link-btn" type="button">Sign out</button>
      </div>
      <p id="quotaLine" class="quota hidden"></p>
    </div>

    <section id="settings" class="settings">
      <div class="setting">
        <div class="setting-copy">
          <span class="setting-title">Shortcut</span>
          <span class="setting-sub setting-sub-on"><span class="hl">Hotkey</span> on any captioned video</span>
        </div>
        <kbd class="kbd" title="Translate hotkey">'</kbd>
      </div>

      <div class="setting">
        <div class="setting-copy">
          <span class="setting-title">Target language</span>
        </div>
        <select id="targetLang" class="select">
          <option value="hi">Hindi</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh">Chinese</option>
          <option value="pt">Portuguese</option>
          <option value="ar">Arabic</option>
          <option value="ru">Russian</option>
        </select>
      </div>
    </section>

    <div class="platforms" aria-label="Supported services">
      <ul class="platform-list">
        <li class="platform-yt" title="YouTube"><img src="brands/yt.png" alt="YouTube"></li>
        <li title="Netflix"><img src="brands/netflix.png" alt="Netflix"></li>
        <li title="JioHotstar"><img src="brands/hotstar.png" alt="JioHotstar"></li>
        <li class="platform-prime" title="Prime Video"><img src="brands/prime.png" alt="Prime Video"></li>
        <li title="Sony LIV"><img src="brands/sonyliv.png" alt="Sony LIV"></li>
      </ul>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
